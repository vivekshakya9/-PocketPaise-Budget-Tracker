name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        curl -fsSL --retry 5 --retry-delay 5 "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o gradle-bin.zip
        sudo unzip -qo gradle-bin.zip -d /opt
        echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH
        rm -f gradle-bin.zip

    - name: Build Debug APK
      run: gradle assembleDebug --no-configuration-cache

    - name: Build Release Bundle (AAB)
      run: gradle bundleRelease --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/bundle/release/app-release.aab
