name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        MIRRORS=(
          "https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip"
          "https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip"
          "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
        )
        for url in "${MIRRORS[@]}"; do
          echo "Attempting to download Gradle from $url..."
          if curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 3 "$url" -o gradle-bin.zip; then
            echo "Successfully downloaded Gradle from $url"
            break
          else
            echo "Failed to download from $url, trying next mirror..."
          fi
        done
        if [ ! -f gradle-bin.zip ]; then
          echo "Error: Could not download Gradle from any mirror."
          exit 1
        fi
        sudo unzip -qo gradle-bin.zip -d /opt
        echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH
        rm -f gradle-bin.zip

    - name: Build Debug APK
      run: gradle assembleDebug --no-configuration-cache

    - name: Build Release Bundle (AAB)
      run: gradle bundleRelease --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/bundle/release/app-release.aab
